# Copy to ~/.tokencanary/config.toml (or point TOKENCANARY_CONFIG at it). All keys are optional.

alpha = 0.01            # share of honest responses the per-response likelihood test rejects
tolerance = 3           # provider alert needs a rejection rate above tolerance * alpha
confidence = 1e-6       # chance that an honest provider is ever flagged
min_overcharge = 0.001  # provider alert needs a worst-case overcharge above 0.1% of tokens
guess_hf = true         # unknown `org/model` names load the Hugging Face tokenizer of that repo

# calibration = "~/.tokencanary/calibration.json"
# log = "~/.tokencanary/audit.jsonl"
# state = "~/.tokencanary/state.json"

[checks]
over_cap = true         # billed above max_tokens
count_mismatch = true   # billed != number of returned tokens

[tokenizers]            # model name pattern -> tokenizer; overrides the bundled registry
# "my-finetune" = "hf:Qwen/Qwen2.5-7B-Instruct"
# "ft:gpt-4o*" = "tiktoken:o200k_base"

[models."meta-llama/*"] # per-model overrides; the most specific pattern wins
tolerance = 5
