[project]
name = "tokencanary"
version = "0.1.0"
description = "Check LLM API token bills against the returned text: count checks, canonical shadow bill, and a likelihood test for padded tokenizations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "openai>=1.40",
    "tiktoken>=0.9",
    "tokenizers>=0.20",
]

[project.optional-dependencies]
local = ["torch>=2.4", "transformers>=4.45"]

[project.scripts]
tokencanary = "tokencanary.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokencanary"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
